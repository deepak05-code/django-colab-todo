<!DOCTYPE html>
<html>
<head>
    <title>Colab Django To-Do</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        input[type="text"] { padding: 8px; width: 70%; }
        button { padding: 8px 15px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
        .done { text-decoration: line-through; color: gray; }
        .actions a { text-decoration: none; margin-left: 10px; font-size: 14px; padding: 4px 8px; border-radius: 4px; }
        .btn-done { background: #e0f7fa; color: #006064; }
        .btn-del { background: #ffebee; color: #b71c1c; }
    </style>
</head>
<body>
    <h2>My Colab To-Do List</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter a new task..." required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li>
                <span class="{% if task.completed %}done{% endif %}">
                    {{ task.title }}
                </span>
                <div class="actions">
                    <a class="btn-done" href="{% url 'complete_task' task.id %}">
                        {% if task.completed %}Undo{% else %}Complete{% endif %}
                    </a>
                    <a class="btn-del" href="{% url 'delete_task' task.id %}">Delete</a>
                </div>
            </li>
        {% empty %}
            <li>No tasks yet. Add one above!</li>
        {% endfor %}
    </ul>
</body>
</html>
